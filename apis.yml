name: Stratim
description: 'Stratim (originally incorporated as Zirx in 2014, rebranded to Stratim in 2017)
  was a San Francisco-based SaaS company that built an enterprise fleet-operations and logistics
  platform for transportation companies, autonomous-vehicle operators, and urban fleets. Its
  three product lines were the Stratim Platform (fleet operations software), the Stratim Exchange
  (on-the-ground vendor fulfillment), and the Stratim Marketplace (fleet-owner/vendor transactions),
  and it advertised API access, a workforce app, processing-engine integration, and SMS updates.
  Founded by Shmulik Fishman and Sean Behr and backed by Norwest Venture Partners and Trinity Ventures
  ($36.4M raised), Stratim was acquired by ACV Auctions in 2021. As of this enrichment pass the
  stratim.com domain is held in custodial parking (CSC Corporate Domains) with no live website,
  developer portal, documentation, or reachable API surface, so no API artifacts could be harvested.'
